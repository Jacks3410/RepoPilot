[project]
name = "repopilot-agent"
version = "0.1.0"
description = "An auditable, recoverable and evaluated software engineering agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.10.0",
    "fastmcp>=3.0.1",
    "openai>=2.16.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.63.0",
]

[project.scripts]
repopilot = "repopilot.main:main"
repopilot-eval = "repopilot.eval_cli:main"
repopilot-benchmark = "repopilot.benchmark_cli:main"
repopilot-compare = "repopilot.benchmark_compare_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "repopilot", "tools"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
